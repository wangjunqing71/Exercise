<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>字幕拼接长图生成</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="panel">
        <div class="section upload-section">
          <h3>上传图片</h3>
          <label for="file" class="btn primary file-upload-btn">选择图片</label>
          <input id="file" type="file" accept="image/*" style="display: none;" />
          <div id="uploadHint" class="muted">支持JPG、PNG、WEBP、GIF格式，最大10MB</div>
        </div>
        <div class="section subtitle-settings-section">
          <h3>字幕设置</h3>
          <div class="subtitle-setting-item">
            <label class="label">切片高度</label>
            <input id="slice" type="range" min="100" max="600" value="220" />
            <div id="sliceVal" class="muted"></div>
          </div>
          <div class="subtitle-setting-item">
            <label class="label">字幕行</label>
            <div id="texts"></div>
            <button id="addText" class="btn">添加一行</button>
          </div>
        </div>
        <div class="section font-section grid">
          <h3>字体设置</h3>
          <div>
            <label class="label">字号</label>
            <input id="fontSize" type="number" value="42" />
          </div>
          <div>
            <label class="label">字重</label>
            <select id="fontWeight">
              <option value="normal">常规</option>
              <option value="bold" selected>粗体</option>
              <option value="lighter">细体</option>
              <option value="100">100</option>
              <option value="200">200</option>
              <option value="300">300</option>
              <option value="400">400</option>
              <option value="500">500</option>
              <option value="600">600</option>
              <option value="700">700</option>
              <option value="800">800</option>
              <option value="900">900</option>
            </select>
          </div>
          <div>
            <label class="label">字体</label>
            <select id="fontFamily">
              <option value="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" selected>系统默认</option>
              <option value="Microsoft YaHei, sans-serif">微软雅黑</option>
              <option value="SimHei, sans-serif">黑体</option>
              <option value="SimSun, serif">宋体</option>
              <option value="KaiTi, serif">楷体</option>
              <option value="Arial, sans-serif">Arial</option>
              <option value="Times New Roman, serif">Times New Roman</option>
            </select>
          </div>
          <div>
            <label class="label">字间距</label>
            <input id="letterSpacing" type="number" value="0" min="-10" max="20" step="1" />
          </div>
          <div>
            <label class="label">行间距</label>
            <input id="lineHeight" type="number" value="1.2" min="0.5" max="3" step="0.1" />
          </div>
          <div>
            <label class="label">描边宽度</label>
            <input id="strokeWidth" type="number" value="2" />
          </div>
          <div>
            <label class="label">填充颜色</label>
            <input id="fill" type="color" value="#FF4D4F" />
          </div>
          <div>
            <label class="label">描边颜色</label>
            <input id="stroke" type="color" value="#FFFFFF" />
          </div>
          <div>
            <label class="label">距底部</label>
            <input id="bottomOffset" type="number" value="24" />
          </div>
          <!-- 文字阴影部分 -->
          <div>
            <label class="label">文字阴影</label>
            <input id="shadowEnable" type="checkbox" />
          </div>
          <div>
            <label class="label">阴影颜色</label>
            <input id="shadowColor" type="color" value="#000000" />
          </div>
          <div>
            <label class="label">阴影模糊</label>
            <input id="shadowBlur" type="number" value="4" min="0" max="20" />
          </div>
          <div>
            <label class="label">阴影X偏移</label>
            <input id="shadowOffsetX" type="number" value="2" min="-20" max="20" />
          </div>
          <div>
            <label class="label">阴影Y偏移</label>
            <input id="shadowOffsetY" type="number" value="2" min="-20" max="20" />
          </div>
        </div>

        <div class="section watermark-section">
          <h3>水印文字设置</h3>
          <div class="grid">
            <div>
              <label class="label">水印内容</label>
              <input id="wmText" type="text" placeholder="可选" />
            </div>
            <div>
              <label class="label">位置</label>
              <select id="wmPos">
                <option value="none">关闭</option>
                <option value="ru">右上</option>
                <option value="rd" selected>右下</option>
              </select>
            </div>
            <div>
              <label class="label">不透明度</label>
              <input id="wmOpacity" type="range" min="0" max="1" step="0.05" value="0.6" />
            </div>
          </div>
        </div>
        <div class="section watermark-section">
            <h3>水印图片设置</h3>
            <div class="grid">
                <div>
                    <div class="label">选择水印图片</div>
                    <div style="position: relative;">
                        <input type="file" id="watermarkImageInput" accept="image/png,image/jpeg,image/webp" style="display: none;">
                        <button id="watermarkImageBtn" class="btn secondary">选择图片</button>
                        <span id="watermarkImageName" class="muted" style="margin-left: 10px;"></span>
                    </div>
                    <div class="muted">支持PNG、JPG、WEBP格式，建议使用透明背景PNG</div>
                </div>
                <div>
                    <div class="label">水印图片透明度</div>
                    <input type="range" id="watermarkImageOpacity" min="0" max="1" step="0.1" value="0.5">
                    <span id="watermarkImageOpacityVal">0.5</span>
                </div>
                <div>
                    <div class="label">水印图片尺寸</div>
                    <input type="number" id="watermarkImageSize" value="100" min="10" max="500" step="10">
                    <span class="muted">像素</span>
                </div>
                <div>
                    <div class="label">水印位置</div>
                    <select id="watermarkImagePosition">
                        <option value="bottom-right">右下角</option>
                        <option value="bottom-left">左下角</option>
                        <option value="top-right">右上角</option>
                        <option value="top-left">左上角</option>
                        <option value="center">居中</option>
                    </select>
                </div>
            </div>
            <div style="margin-top: 10px;">
                <button id="removeWatermarkImageBtn" class="btn danger" style="display: none;">移除水印图片</button>
            </div>
        </div>
        <div class="section grid export-section">
          <h3>导出设置</h3>
          <div>
            <label class="label">导出格式</label>
            <select id="exportFormat">
              <option value="png" selected>PNG</option>
              <option value="jpg">JPG</option>
            </select>
          </div>
          <div>
            <label class="label">JPG质量</label>
            <input id="jpgQuality" type="range" min="0.1" max="1" step="0.1" value="0.9" />
            <div id="jpgQualityVal" class="muted">0.9</div>
          </div>
        </div>
        <div id="errorContainer" class="error-container" style="display: none;"></div>
        <div class="section action-section">
          <h3>操作</h3>
          <button id="download" class="btn primary">导出</button>
          <button id="copy" class="btn">复制到剪贴板</button>
        </div>
      </div>
      <div class="preview">
        <div class="preview-card">
          <canvas id="canvas"></canvas>
        </div>
        <div id="hint" class="muted"></div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
